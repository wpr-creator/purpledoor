<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Purple Door Universe</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/home-scene.css" />
</head>
<body class="home-body">
  <main class="universe-shell" aria-label="The Purple Door Universe">
    <section class="scene-stage" aria-label="Purple Door Universe home scene">
      <div class="sky-layer" aria-hidden="true">
        <img class="planet planet-a" src="assets/kenney/2D assets/Planets/Planets/planet08.png" alt="">
        <img class="planet planet-b" src="assets/kenney/2D assets/Planets/Planets/planet03.png" alt="">
        <img class="space-star star-a" src="assets/kenney/2D assets/Simple Space/PNG/Retina/star_large.png" alt="">
        <img class="space-star star-b" src="assets/kenney/2D assets/Simple Space/PNG/Retina/star_medium.png" alt="">
        <img class="space-star star-c" src="assets/kenney/2D assets/Simple Space/PNG/Retina/star_small.png" alt="">
        <img class="magic magic-a" src="assets/kenney/2D assets/Particle Pack/PNG (Transparent)/magic_04.png" alt="">
        <img class="magic magic-b" src="assets/kenney/2D assets/Particle Pack/PNG (Transparent)/spark_04.png" alt="">
      </div>

      <header class="title-lockup">
        <p class="eyebrow">Mrs. Rogers’</p>
        <h1>The Purple Door Universe</h1>
      </header>

      <section class="world-board" aria-label="Choose a world">
        <div class="island-shadow" aria-hidden="true"></div>
        <div class="island-base" aria-hidden="true"></div>

        <a class="world-node word-node" href="games/wordquest.html" aria-label="Enter Word Quest">
          <span class="node-glow"></span>
          <span class="node-building library-building">
            <span class="book-stack book-one"></span>
            <span class="book-stack book-two"></span>
            <span class="book-roof"></span>
          </span>
          <span class="node-plaque">Word Quest</span>
        </a>

        <a class="world-node math-node" href="games/mathquest.html" aria-label="Enter Math Quest">
          <span class="node-glow"></span>
          <span class="node-building math-building">
            <span class="gear-dot dot-one"></span>
            <span class="gear-dot dot-two"></span>
            <span class="gear-dot dot-three"></span>
          </span>
          <span class="node-plaque">Math Quest</span>
        </a>

        <a class="world-node wonder-node" href="games/portalpark.html" aria-label="Enter Wonder Trails">
          <span class="node-glow"></span>
          <span class="node-building trail-building">
            <span class="trail-map"></span>
            <span class="trail-flag"></span>
          </span>
          <span class="node-plaque">Wonder Trails</span>
        </a>

        <div class="purple-door-landmark" aria-hidden="true">
          <div class="door-aura"></div>
          <div class="door-frame">
            <div class="door-panel">
              <span class="door-arch"></span>
              <span class="door-knob"></span>
            </div>
          </div>
          <div class="door-steps"></div>
        </div>

        <img class="companion companion-one" src="assets/kenney/2D assets/Monster Builder Pack/PNG/Default/body_whiteD.png" alt="" aria-hidden="true">
        <img class="companion companion-two" src="assets/kenney/2D assets/Shape Characters/PNG/Default/shapeCircle_blue.png" alt="" aria-hidden="true">
      </section>

      <footer class="scene-footer">
        <a class="small-link" href="games/wordquest.html">Start with Words</a>
        <a class="small-link" href="games/mathquest.html">Start with Numbers</a>
        <a class="small-link" href="games/portalpark.html">Start Exploring</a>
      </footer>
    </section>
  </main>

  <script src="js/homeScene.js"></script>
</body>
</html>
