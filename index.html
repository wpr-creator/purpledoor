<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Purple Door Universe</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/ui.css" />
</head>
<body class="home-page">
  <div class="starfield" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <header class="hero-header">
    <p class="eyebrow">Mrs. Rogers’ Room Presents</p>
    <h1>The Purple Door Universe</h1>
  </header>

  <main class="universe-shell">
    <section class="door-stage" aria-label="Choose a world">
      <div class="cosmic-orbit orbit-one" aria-hidden="true"></div>
      <div class="cosmic-orbit orbit-two" aria-hidden="true"></div>

      <a class="world-card word-card" href="games/wordquest.html" aria-label="Enter Word Quest">
        <img class="world-panel" src="assets/kenney/ui/UI Adventure Pack/PNG/panel_brown.png" alt="" />
        <div class="world-content">
          <img class="world-icon" src="assets/kenney/ui/UI Pack/PNG/Yellow/Default/star.png" alt="" />
          <h2>Word Quest</h2>
          <p>Open story gates</p>
        </div>
      </a>

      <a class="world-card math-card" href="games/mathquest.html" aria-label="Enter Math Quest">
        <img class="world-panel" src="assets/kenney/ui/UI Adventure Pack/PNG/panel_blue.png" alt="" />
        <div class="world-content">
          <img class="world-icon" src="assets/kenney/ui/UI Pack - Adventure/PNG/Default/minimap_icon_jewel_yellow.png" alt="" />
          <h2>Math Quest</h2>
          <p>Power up numbers</p>
        </div>
      </a>

      <div class="purple-door" aria-hidden="true">
        <div class="door-glow"></div>
        <div class="door-shape">
          <div class="door-window"></div>
          <div class="door-arches"><span></span><span></span></div>
          <div class="door-knob"></div>
        </div>
        <div class="door-shadow"></div>
      </div>

      <a class="world-card wonder-card" href="games/portalpark.html" aria-label="Enter Wonder Trails">
        <img class="world-panel" src="assets/kenney/ui/UI Adventure Pack/PNG/panel_beigeLight.png" alt="" />
        <div class="world-content dark-text">
          <img class="world-icon" src="assets/kenney/ui/UI Pack - Adventure/PNG/Default/minimap_compass_toon_n.png" alt="" />
          <h2>Wonder Trails</h2>
          <p>Discover new paths</p>
        </div>
      </a>

      <img class="space-prop prop-star-a" src="assets/kenney/ui/UI Pack/PNG/Yellow/Default/star_outline_depth.png" alt="" aria-hidden="true" />
      <img class="space-prop prop-gem-a" src="assets/kenney/ui/UI Pack - Adventure/PNG/Default/minimap_icon_jewel_white.png" alt="" aria-hidden="true" />
      <img class="space-prop prop-gem-b" src="assets/kenney/ui/UI Pack - Adventure/PNG/Default/minimap_icon_jewel_red.png" alt="" aria-hidden="true" />
    </section>
  </main>
</body>
</html>
