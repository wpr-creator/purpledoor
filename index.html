<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Purple Door Universe</title>
  <link rel="stylesheet" href="css/global.css" />
</head>
<body class="home-world">
  <main class="universe-stage" aria-label="The Purple Door Universe">
    <div class="sky-layer stars-a"></div>
    <div class="sky-layer stars-b"></div>

    <img class="planet planet-one" src="assets/kenney/2D assets/Planets/Planets/planet08.png" alt="" />
    <img class="planet planet-two" src="assets/kenney/2D assets/Planets/Planets/planet03.png" alt="" />
    <img class="planet planet-three" src="assets/kenney/2D assets/Planets/Planets/planet05.png" alt="" />

    <img class="ship drift-ship" src="assets/kenney/2D assets/Simple Space/PNG/Retina/ship_H.png" alt="" />
    <img class="spark spark-one" src="assets/kenney/2D assets/Particle Pack/PNG (Transparent)/magic_04.png" alt="" />
    <img class="spark spark-two" src="assets/kenney/2D assets/Particle Pack/PNG (Transparent)/star_05.png" alt="" />
    <img class="spark spark-three" src="assets/kenney/2D assets/Particle Pack/PNG (Transparent)/light_02.png" alt="" />

    <section class="title-lockup" aria-label="Title">
      <p class="eyebrow">Mrs. Rogers’</p>
      <h1>The Purple Door Universe</h1>
    </section>

    <section class="world-island" aria-label="World map">
      <div class="island-shadow"></div>
      <div class="island-base"></div>
      <div class="island-top"></div>
      <div class="path-ring"></div>

      <a class="world-gate word-gate" href="games/wordquest.html" aria-label="Enter Word Quest">
        <span class="gate-glow"></span>
        <span class="mini-building library-building">
          <span class="roof"></span>
          <span class="tower tower-left"></span>
          <span class="tower tower-right"></span>
          <span class="window w1"></span>
          <span class="window w2"></span>
        </span>
        <span class="gate-plaque">Word Quest</span>
      </a>

      <a class="world-gate math-gate" href="games/mathquest.html" aria-label="Enter Monster Math Lab">
        <span class="gate-glow"></span>
        <span class="lab-building">
          <span class="lab-dome"></span>
          <span class="lab-body"></span>
          <img class="lab-monster body" src="assets/kenney/2D assets/Monster Builder Pack/PNG/Default/body_blueC.png" alt="" />
          <img class="lab-monster eye" src="assets/kenney/2D assets/Monster Builder Pack/PNG/Default/eye_cute_light.png" alt="" />
        </span>
        <span class="gate-plaque">Monster Math Lab</span>
      </a>

      <a class="world-gate wild-gate" href="games/portalpark.html" aria-label="Enter The Wild Doors">
        <span class="gate-glow"></span>
        <span class="wild-camp">
          <span class="tent"></span>
          <span class="sign-post"></span>
          <span class="sign-board"></span>
          <span class="tiny-fire"></span>
        </span>
        <span class="gate-plaque">The Wild Doors</span>
      </a>

      <section class="door-tower" aria-label="Purple Door">
        <div class="tower-aura"></div>
        <div class="tower-spire"></div>
        <div class="tower-body">
          <div class="purple-door"><span class="door-shine"></span><span class="door-knob"></span></div>
        </div>
        <div class="tower-steps"></div>
      </section>

      <div class="companion c1" aria-hidden="true">
        <img class="monster-body" src="assets/kenney/2D assets/Monster Builder Pack/PNG/Default/body_greenB.png" alt="" />
        <img class="monster-eye" src="assets/kenney/2D assets/Monster Builder Pack/PNG/Default/eye_cute_dark.png" alt="" />
      </div>
      <div class="companion c2" aria-hidden="true">
        <img class="monster-body" src="assets/kenney/2D assets/Monster Builder Pack/PNG/Default/body_yellowA.png" alt="" />
        <img class="monster-eye" src="assets/kenney/2D assets/Monster Builder Pack/PNG/Default/eye_human_green.png" alt="" />
      </div>

      <div class="floating-key key-one">◆</div>
      <div class="floating-key key-two">✦</div>
    </section>

    <section class="status-strip" aria-label="Adventures">
      <div class="status-card"><strong>Titles</strong><span>Find your first rank</span></div>
      <div class="status-card"><strong>Companions</strong><span>Meet the odd little helpers</span></div>
      <div class="status-card"><strong>Worlds</strong><span>Choose a door to begin</span></div>
    </section>
  </main>
  <script src="js/homeScene.js"></script>
</body>
</html>
