<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Purple Door Universe</title>
  <link rel="stylesheet" href="css/global.css">
</head>
<body>
  <main class="home-shell">
    <section class="hero">
      <p class="eyebrow">Mrs. Rogers’ Room Presents</p>
      <h1>The Purple Door Universe</h1>
    </section>

    <section class="universe-board" aria-label="Choose a world">
      <div class="starscape" aria-hidden="true">
        <span class="star star-a"></span>
        <span class="star star-b"></span>
        <span class="star star-c"></span>
        <span class="star star-d"></span>
        <span class="star star-e"></span>
      </div>

      <div class="center-door" aria-hidden="true">
        <div class="door-glow"></div>
        <div class="door">
          <div class="door-window"></div>
          <div class="door-panel left"></div>
          <div class="door-panel right"></div>
          <div class="door-knob"></div>
        </div>
        <div class="door-step"></div>
      </div>

      <nav class="world-row">
        <a class="world-card word" href="games/wordquest.html">
          <img class="card-frame" src="assets/kenney/ui/UI Adventure Pack/PNG/panel_blue.png" alt="">
          <span class="world-icon">Aa</span>
          <strong>Word Quest</strong>
          <span>Open story gates</span>
        </a>

        <a class="world-card math" href="games/mathquest.html">
          <img class="card-frame" src="assets/kenney/ui/UI Adventure Pack/PNG/panel_beigeLight.png" alt="">
          <span class="world-icon">123</span>
          <strong>Math Quest</strong>
          <span>Power up number skills</span>
        </a>

        <a class="world-card wonder" href="games/portalpark.html">
          <img class="card-frame" src="assets/kenney/ui/UI Adventure Pack/PNG/panel_brown.png" alt="">
          <span class="world-icon">★</span>
          <strong>Wonder Trails</strong>
          <span>Find hidden discoveries</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
